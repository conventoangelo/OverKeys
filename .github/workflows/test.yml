name: Tests

on:
  push:
    branches: [main, develop, refactor/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  test-coverage-report:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install coverage tools
        run: |
          dart pub global activate coverage
          choco install lcov -y
        shell: pwsh

      - name: Generate coverage report
        run: |
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          genhtml coverage/lcov.info -o coverage/html
        shell: pwsh

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
            const lines = lcov.split('\\n');
            let totalLines = 0;
            let coveredLines = 0;

            for (const line of lines) {
              if (line.startsWith('LF:')) {
                totalLines += parseInt(line.substring(3));
              } else if (line.startsWith('LH:')) {
                coveredLines += parseInt(line.substring(3));
              }
            }

            const coverage = totalLines > 0 ? ((coveredLines / totalLines) * 100).toFixed(2) : 0;

            const comment = `## Test Coverage Report\\n\\n` +
              `📊 **Coverage**: ${coverage}%\\n` +
              `✅ **Lines Covered**: ${coveredLines} / ${totalLines}\\n\\n` +
              `Coverage details are available in the build artifacts.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
