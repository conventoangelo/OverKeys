name: overkeys
description: "An open-source, customizable on-screen keyboard for Windows. Learn and practice alternative layouts, personalize appearance, and improve your typing."
publish_to: "none"
version: 0.3.5
repository: https://github.com/conventoangelo/OverKeys

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  ffi: ^2.1.5
  win32: ^5.5.4
  desktop_multi_window: ^0.3.0
  shared_preferences: ^2.5.5
  flex_color_picker: ^4.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  launch_at_startup: ^0.5.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.2
  url_launcher: ^6.3.1
  hotkey_manager: ^0.2.3
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.6
  logging: ^1.3.0
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.3"
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  fonts:
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Light.ttf
          weight: 300
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

  assets:
    - assets/images/app_icon.ico
    - assets/images/app_icon.png
    - assets/images/github-mark.png
    - assets/images/learn_mode.png
    - assets/images/kofi_blue.png
    - assets/images/bmac_yellow.png

flutter_launcher_icons:
  image_path: "assets/images/OK.png"
  windows:
    generate: true
    image_path: "assets/images/OK.png"
    icon_size: 256 # min:48, max:256, default: 48
